
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | DAMI TRAVELING</title>
  <meta name="description" content="Travel photos and beautiful memories from DAMI TRAVELING.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #07110e;
      color: #f5f8f4;
      min-height: 100vh;
    }

    header {
      background: #102019;
      border-bottom: 1px solid #304737;
      padding: 20px 5%;
    }

    .nav {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .logo {
      color: #b6f36a;
      font-size: 23px;
      font-weight: 900;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover {
      color: #b6f36a;
    }

    .hero {
      text-align: center;
      padding: 65px 20px 35px;
      background: linear-gradient(180deg, #102019, #07110e);
    }

    .hero small {
      color: #b6f36a;
      letter-spacing: 4px;
      font-weight: bold;
    }

    h1 {
      font-size: clamp(35px, 6vw, 58px);
      margin: 15px 0;
    }

    h1 span {
      color: #b6f36a;
    }

    .hero p {
      color: #b9c7bd;
      line-height: 1.8;
    }

    .container {
      width: min(1200px, 92%);
      margin: auto;
      padding: 25px 0 65px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .toolbar h2 {
      font-size: 25px;
    }

    #status {
      color: #b6f36a;
      font-size: 14px;
      margin-top: 8px;
    }

    .btn {
      border: 0;
      border-radius: 7px;
      background: #b6f36a;
      color: #102019;
      font-weight: bold;
      padding: 12px 18px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      background: white;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .photo {
      background: #102019;
      border: 1px solid #2c4432;
      border-radius: 12px;
      overflow: hidden;
      transition: transform .25s, border-color .25s;
    }

    .photo:hover {
      transform: translateY(-5px);
      border-color: #b6f36a;
    }

    .photo img {
      width: 100%;
      height: 260px;
      display: block;
      object-fit: cover;
      cursor: pointer;
      background: #1b3022;
    }

    .caption {
      padding: 14px;
      overflow-wrap: anywhere;
      color: #e5eee6;
      font-size: 14px;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 45px 20px;
      background: #102019;
      border-radius: 12px;
      color: #c2cec4;
      line-height: 1.9;
    }

    footer {
      background: #102019;
      border-top: 1px solid #304737;
      text-align: center;
      padding: 25px 15px;
      color: #b9c7bd;
      font-size: 13px;
      line-height: 2;
    }

    footer a {
      color: #b6f36a;
      text-decoration: none;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .94);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .lightbox.show {
      display: flex;
    }

    .lightbox img {
      max-width: 95%;
      max-height: 85vh;
      object-fit: contain;
    }

    .close {
      position: absolute;
      top: 15px;
      right: 22px;
      color: white;
      font-size: 38px;
      cursor: pointer;
      background: transparent;
      border: 0;
    }

    @media (max-width: 800px) {
      .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .photo img {
        height: 220px;
      }
    }

    @media (max-width: 520px) {
      .nav {
        justify-content: center;
      }

      nav {
        justify-content: center;
        gap: 13px;
      }

      .gallery {
        grid-template-columns: 1fr;
      }

      .photo img {
        height: 260px;
      }

      .toolbar {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="nav">
      <a class="logo" href="index.html">DAMI TRAVELING</a>

      <nav>
        <a href="index.html">Home</a>
        <a href="videos.html">Videos</a>
        <a href="destinations.html">Destinations</a>
        <a href="gallery.html">Gallery</a>
        <a href="index.html#about">About</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <small>MY TRAVEL MEMORIES</small>
    <h1>Photo <span>Gallery</span></h1>
    <p>ගමයි, කඳුයි, ඇළ දොළයි — සුන්දර මතක එකතුවක් ❤️</p>
  </section>

  <main class="container">
    <div class="toolbar">
      <div>
        <h2>My Photos 📸</h2>
        <p id="status">Photos සොයමින් පවතී...</p>
      </div>

      <button class="btn" id="reload" type="button">
        Reload Photos ↻
      </button>
    </div>

    <div class="gallery" id="gallery">
      <div class="empty">ඔයාගේ photos සොයමින් පවතී...</div>
    </div>
  </main>

  <div class="lightbox" id="lightbox">
    <button class="close" id="close" aria-label="Close">&times;</button>
    <img id="largePhoto" src="" alt="Large travel photo">
  </div>

  <footer>
    <p>© 2026 DAMI TRAVELING</p>
    <p>Made with ❤️ for travel lovers</p>
    <a href="https://www.youtube.com/@damitha-w6f"
       target="_blank" rel="noopener">Visit My YouTube Channel</a>
  </footer>

  <script>
    const username = "imankamaduranga999-afk";
    const repo = "imankamaduranga999-afk.github.io";

    const gallery = document.getElementById("gallery");
    const statusText = document.getElementById("status");
    const reloadButton = document.getElementById("reload");
    const lightbox = document.getElementById("lightbox");
    const largePhoto = document.getElementById("largePhoto");

    function showMessage(message) {
      gallery.innerHTML = "";
      const box = document.createElement("div");
      box.className = "empty";
      box.textContent = message;
      gallery.appendChild(box);
    }

    function openPhoto(url, alt) {
      largePhoto.src = url;
      largePhoto.alt = alt;
      lightbox.classList.add("show");
    }

    document.getElementById("close").addEventListener("click", () => {
      lightbox.classList.remove("show");
      largePhoto.src = "";
    });

    lightbox.addEventListener("click", (event) => {
      if (event.target === lightbox) {
        lightbox.classList.remove("show");
        largePhoto.src = "";
      }
    });

    async function loadPhotos() {
      statusText.textContent = "Photos සොයමින් පවතී...";
      showMessage("ටිකක් ඉන්න මචං... photos load වෙනවා.");

      try {
        const response = await fetch(
          `https://api.github.com/repos/${username}/${repo}/contents/`,
          { headers: { "Accept": "application/vnd.github+json" } }
        );

        if (!response.ok) {
          throw new Error("GitHub file list ලබාගන්න බැරි වුණා.");
        }

        const files = await response.json();

        const imageFiles = files.filter(file =>
          file.type === "file" &&
          /\.(jpe?g|png|webp|gif|avif)$/i.test(file.name)
        );

        if (imageFiles.length === 0) {
          statusText.textContent = "Photos හමු වුණේ නැහැ.";
          showMessage(
            "Repository එකේ ප්‍රධාන folder එකේ photos හමු වුණේ නැහැ. " +
            "Photos වෙනත් folder එකක තිබෙනවා නම් code එකට ඒ folder එකත් එකතු කළ යුතුයි."
          );
          return;
        }

        gallery.innerHTML = "";

        imageFiles.forEach((file, index) => {
          const card = document.createElement("article");
          card.className = "photo";

          const img = document.createElement("img");
          img.src = file.download_url;
          img.alt = file.name;
          img.loading = "lazy";

          img.addEventListener("click", () => {
            openPhoto(file.download_url, file.name);
          });

          const caption = document.createElement("div");
          caption.className = "caption";
          caption.textContent = file.name;

          img.addEventListener("error", () => {
            card.remove();
          });

          card.appendChild(img);
          card.appendChild(caption);
          gallery.appendChild(card);
        });

        statusText.textContent =
          imageFiles.length + " photos හමු වුණා ❤️";

      } catch (error) {
        statusText.textContent = "Photos load කිරීමට නොහැකි වුණා.";
        showMessage(
          "මචං, GitHub එකෙන් photos ලැයිස්තුව ගන්න බැරි වුණා. " +
          "Internet connection එක පරීක්ෂා කර Reload Photos ඔබන්න. " +
          "තවමත් වැඩ නැත්නම් repository එකේ photos තියෙන folder එක පරීක්ෂා කරන්න."
        );
      }
    }

    reloadButton.addEventListener("click", loadPhotos);

    loadPhotos();
  </script>

</body>
</html>
