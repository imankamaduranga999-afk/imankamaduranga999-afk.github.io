
<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Gallery | DAMI TRAVELING</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07110e;
      color: #f5f8f4;
    }
    header {
      padding: 20px;
      background: #102019;
      border-bottom: 1px solid #344839;
    }
    .nav {
      max-width: 1150px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    .logo {
      color: #b6f36a;
      font-size: 22px;
      font-weight: 900;
      text-decoration: none;
    }
    nav { display: flex; gap: 16px; flex-wrap: wrap; }
    nav a { color: white; text-decoration: none; }
    nav a:hover { color: #b6f36a; }
    .hero {
      padding: 55px 20px;
      text-align: center;
      background: linear-gradient(135deg, #193524, #07110e);
    }
    .hero small { color: #b6f36a; letter-spacing: 3px; }
    h1 { font-size: clamp(36px, 7vw, 58px); margin: 15px 0; }
    h1 span { color: #b6f36a; }
    .hero p { color: #c3cec5; }
    main { max-width: 1150px; margin: auto; padding: 30px 18px 60px; }
    #status { color: #b6f36a; margin-bottom: 20px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }
    .photo {
      overflow: hidden;
      border-radius: 12px;
      background: #102019;
      border: 1px solid #344839;
    }
    .photo img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
      cursor: pointer;
      background: #193524;
    }
    .caption { padding: 12px; overflow-wrap: anywhere; }
    .empty {
      grid-column: 1 / -1;
      padding: 30px;
      text-align: center;
      color: #c3cec5;
      line-height: 1.8;
    }
    footer {
      padding: 25px;
      text-align: center;
      background: #102019;
      color: #c3cec5;
    }
    footer a { color: #b6f36a; }
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(0,0,0,.94);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 95%; max-height: 85vh; object-fit: contain; }
    .close {
      position: absolute;
      top: 10px;
      right: 22px;
      font-size: 38px;
      color: white;
      background: none;
      border: 0;
      cursor: pointer;
    }
    @media (max-width: 750px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .photo img { height: 220px; }
    }
    @media (max-width: 500px) {
      .nav { justify-content: center; }
      nav { justify-content: center; }
      .grid { grid-template-columns: 1fr; }
      .photo img { height: 260px; }
    }
  </style>
</head>
<body>

<header>
  <div class="nav">
    <a class="logo" href="index.html">DAMI TRAVELING</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="videos.html">Videos</a>
      <a href="destinations.html">Destinations</a>
      <a href="gallery.html">Gallery</a>
      <a href="index.html#about">About</a>
    </nav>
  </div>
</header>

<section class="hero">
  <small>MY TRAVEL MEMORIES</small>
  <h1>My Photo <span>Gallery</span> 📸</h1>
  <p>මගේ ගමන් බිමන්වල සුන්දර මතකයන් ❤️</p>
</section>

<main>
  <h2>My Photos</h2>
  <p id="status">Photos load වෙමින් පවතී...</p>
  <div class="grid" id="gallery"></div>
</main>

<div class="lightbox" id="lightbox">
  <button class="close" id="close" aria-label="Close">&times;</button>
  <img id="largePhoto" src="" alt="Travel photo">
</div>

<footer>
  <p>© 2026 DAMI TRAVELING</p>
  <a href="https://www.youtube.com/@damitha-w6f"
     target="_blank" rel="noopener">My YouTube Channel</a>
</footer>

<script>
const files = [
  "WhatsApp Image 2026-10-24 at 7.42.54 AM.jpeg",
  "WhatsApp Image 2026-10-24 at 7.42.54 AM (1).jpeg",
  "WhatsApp Image 2026-10-24 at 7.42.54 AM (2).jpeg",

  "WhatsApp Image 2026-10-24 at 7.43.20 AM.jpeg",
  "WhatsApp Image 2026-10-24 at 7.43.20 AM (1).jpeg",
  "WhatsApp Image 2026-10-24 at 7.43.20 AM (2).jpeg",
  "WhatsApp Image 2026-10-24 at 7.43.20 AM (3).jpeg",

  "WhatsApp Image 2026-10-24 at 7.43.22 AM.jpeg",
  "WhatsApp Image 2026-10-24 at 7.43.22 AM (1).jpeg",
  "WhatsApp Image 2026-10-24 at 7.43.22 AM (2).jpeg",
  "WhatsApp Image 2026-10-24 at 7.43.22 AM (3).jpeg",

  "WhatsApp Image 2026-10-24 at 7.43.25 AM.jpeg",
  "WhatsApp Image 2026-10-24 at 7.43.25 AM (1).jpeg",
  "WhatsApp Image 2026-10-24 at 7.43.25 AM (2).jpeg",
  "WhatsApp Image 2026-10-24 at 7.43.25 AM (3).jpeg",

  "WhatsApp Image 2026-10-24 at 7.43.29 AM.jpeg",
  "WhatsApp Image 2026-10-24 at 7.43.29 AM (1).jpeg",
  "WhatsApp Image 2026-10-24 at 7.43.29 AM (2).jpeg",
  "WhatsApp Image 2026-10-24 at 7.43.29 AM (3).jpeg",
  "WhatsApp Image 2026-10-24 at 7.43.29 AM (4).jpeg",
  "WhatsApp Image 2026-10-24 at 7.43.29 AM (5).jpeg",
  "WhatsApp Image 2026-10-24 at 7.43.29 AM (6).jpeg",
  "WhatsApp Image 2026-10-24 at 7.43.29 AM (7).jpeg",
  "WhatsApp Image 2026-10-24 at 7.43.29 AM (8).jpeg",
  "WhatsApp Image 2026-10-24 at 7.43.29 AM (9).jpeg",
  "WhatsApp Image 2026-10-24 at 7.43.29 AM (10).jpeg",
  "WhatsApp Image 2026-10-24 at 7.43.29 AM (11).jpeg",
  "WhatsApp Image 2026-10-24 at 7.43.29 AM (12).jpeg",
  "WhatsApp Image 2026-10-24 at 7.43.29 AM (13).jpeg",
  "WhatsApp Image 2026-10-24 at 7.43.29 AM (14).jpeg",
  "WhatsApp Image 2026-10-24 at 7.43.29 AM (15).jpeg",
  "WhatsApp Image 2026-10-24 at 7.43.29 AM (16).jpeg",
  "WhatsApp Image 2026-10-24 at 7.43.29 AM (17).jpeg"
];

const gallery = document.getElementById("gallery");
const status = document.getElementById("status");
let loaded = 0;
let failed = 0;

files.forEach((name) => {
  const card = document.createElement("article");
  card.className = "photo";

  const img = document.createElement("img");
  img.src = encodeURI(name);
  img.alt = name;
  img.loading = "lazy";

  const caption = document.createElement("div");
  caption.className = "caption";
  caption.textContent = "DAMI TRAVELING";

  img.onload = () => {
    loaded++;
    status.textContent = loaded + " photos loaded ❤️";
  };

  img.onerror = () => {
    failed++;
    card.remove();
    status.textContent =
      loaded + " photos loaded. " + failed + " photos could not load.";
  };

  img.onclick = () => {
    document.getElementById("largePhoto").src = img.src;
    document.getElementById("lightbox").classList.add("open");
  };

  card.appendChild(img);
  card.appendChild(caption);
  gallery.appendChild(card);
});

document.getElementById("close").onclick = () => {
  document.getElementById("lightbox").classList.remove("open");
  document.getElementById("largePhoto").src = "";
};

document.getElementById("lightbox").onclick = (event) => {
  if (event.target.id === "lightbox") {
    event.currentTarget.classList.remove("open");
    document.getElementById("largePhoto").src = "";
  }
};

if (files.length) {
  status.textContent = "ඔයාගේ GitHub photos load වෙමින් පවතී...";
}
</script>

</body>
</html>
